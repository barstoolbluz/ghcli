    "hook": {
      "on-activate": "# RESET=1 flox activate — triggers a full credential wipe\nif [[ \"${RESET:-0}\" == \"1\" ]]; then\n    if command -v ghcli-reset >/dev/null 2>&1; then\n        ghcli-reset --all --yes\n    else\n        echo \"Error: ghcli-reset not found on PATH\" >&2\n    fi\n    return 0\nfi\n\nexport GH_NEEDS_SETUP=0\n\n_ghcli_config=\"${XDG_CONFIG_HOME:-$HOME/.config}/gh/nix/github_config\"\n_ghcli_helper=\"${XDG_CONFIG_HOME:-$HOME/.config}/gh/nix/gh-token-helper\"\n\n# Use the SSH key path from config for git operations (avoids needing ~/.ssh/config to match)\n_ssh_key=\"$(awk -F= '$1 == \"SSH_KEY_PATH\" {print $2}' \"$_ghcli_config\" 2>/dev/null)\"\nif [[ -n \"$_ssh_key\" && -f \"$_ssh_key\" ]]; then\n    export GIT_SSH_COMMAND=\"ssh -i '${_ssh_key}'\"\nfi\nunset _ssh_key\n_ghcli_token=\"\"\nif [[ -x \"$_ghcli_helper\" ]]; then\n    _ghcli_token=\"$(\"$_ghcli_helper\" 2>/dev/null || true)\"\nfi\nif [[ -n \"$_ghcli_token\" ]]; then\n    export GH_TOKEN=\"$_ghcli_token\"\n    export GITHUB_TOKEN=\"$_ghcli_token\"\nelse\n    if ! command gh auth status >/dev/null 2>&1; then\n        export GH_NEEDS_SETUP=1\n    fi\nfi\nunset _ghcli_config _ghcli_helper _ghcli_token\n"
    },
    "profile": {
      "bash": "if [[ \"$GH_NEEDS_SETUP\" == \"1\" ]]; then\n    echo \"\"\n    echo \"⚠  GitHub CLI is not authenticated.\"\n    echo \"   Run 'ghcli-setup' to set up authentication.\"\n    echo \"\"\nfi\n\ngh() {\n    local helper=\"${XDG_CONFIG_HOME:-$HOME/.config}/gh/nix/gh-token-helper\"\n    local token=''\n    token=\"$(\"$helper\" 2>/dev/null || true)\"\n    if [[ -n \"$token\" ]]; then\n        GH_TOKEN=\"$token\" GITHUB_TOKEN=\"$token\" command gh \"$@\"\n    else\n        command gh \"$@\"\n    fi\n}\n",
      "zsh": "if [[ \"$GH_NEEDS_SETUP\" == \"1\" ]]; then\n    echo \"\"\n    echo \"⚠  GitHub CLI is not authenticated.\"\n    echo \"   Run 'ghcli-setup' to set up authentication.\"\n    echo \"\"\nfi\n\ngh() {\n    local helper=\"${XDG_CONFIG_HOME:-$HOME/.config}/gh/nix/gh-token-helper\"\n    local token=''\n    token=\"$(\"$helper\" 2>/dev/null || true)\"\n    if [[ -n \"$token\" ]]; then\n        GH_TOKEN=\"$token\" GITHUB_TOKEN=\"$token\" command gh \"$@\"\n    else\n        command gh \"$@\"\n    fi\n}\n",
      "fish": "if test \"$GH_NEEDS_SETUP\" = \"1\"\n    echo \"\"\n    echo \"⚠  GitHub CLI is not authenticated.\"\n    echo \"   Run 'ghcli-setup' to set up authentication.\"\n    echo \"\"\nend\n\nfunction gh\n    if test -n \"$XDG_CONFIG_HOME\"\n        set -l config_base \"$XDG_CONFIG_HOME\"\n    else\n        set -l config_base \"$HOME/.config\"\n    end\n    set -l helper \"$config_base/gh/nix/gh-token-helper\"\n    set -l token (\"$helper\" 2>/dev/null; or true)\n    if test -n \"$token\"\n        env GH_TOKEN=\"$token\" GITHUB_TOKEN=\"$token\" command gh $argv\n    else\n        command gh $argv\n    end\nend\n"
    },
    "options": {}
